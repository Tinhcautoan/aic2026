<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Video Competition</title>
    <style>
        :root {
            --bg: #0f0f14;
            --panel: #1a1a24;
            --border: #2a2a3a;
            --text: #e0e0e8;
            --text-secondary: #8888a0;
            --accent: #6c5ce7;
            --success: #00d68f;
            --error: #ff5252;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────────── */
        .header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 52px;
            flex-shrink: 0;
            gap: 20px;
        }
        .header h1 { font-size: 1.05rem; font-weight: 600; white-space: nowrap; }
        .header .tabs { display: flex; gap: 4px; margin-left: 16px; }
        .header .tabs button {
            background: transparent; border: 1px solid transparent; color: var(--text-secondary);
            padding: 6px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; transition: all 0.15s;
        }
        .header .tabs button:hover { color: var(--text); background: rgba(108,92,231,0.1); }
        .header .tabs button.active {
            background: var(--accent); color: #fff; border-color: var(--accent);
        }
        .header-right {
            margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 0.78rem;
        }
        .header-right a {
            color: var(--text-secondary); text-decoration: none; transition: color 0.15s;
        }
        .header-right a:hover { color: var(--accent); }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px;
            background: var(--success);
        }
        .status-dot.offline { background: var(--error); }

        /* ── Main layout ────────────────────────────────────── */
        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* ── Left panel ─────────────────────────────────────── */
        .control-panel {
            width: 360px; min-width: 360px; background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px; display: flex; flex-direction: column; gap: 14px;
            flex-shrink: 0; overflow-y: auto;
        }
        .control-panel label {
            font-size: 0.72rem; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px;
        }
        .control-panel textarea,
        .control-panel input[type="text"],
        .control-panel input[type="number"] {
            width: 100%; padding: 9px 11px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 7px;
            color: var(--text); font-size: 0.88rem; outline: none;
            font-family: inherit; transition: border-color 0.2s;
        }
        .control-panel textarea:focus,
        .control-panel input:focus { border-color: var(--accent); }
        .control-panel textarea { min-height: 64px; resize: vertical; }
        .control-panel select {
            width: 100%; padding: 8px 11px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 7px;
            color: var(--text); font-size: 0.88rem; outline: none; cursor: pointer;
        }
        .mode-controls { display: none; flex-direction: column; gap: 14px; }
        .mode-controls.active { display: flex; }

        /* Upload zone */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 14px;
            text-align: center; cursor: pointer; font-size: 0.8rem; color: var(--text-secondary);
        }
        .upload-zone:hover { border-color: var(--accent); }
        .upload-zone input { display: none; }
        #imagePreviewBox img {
            width: 100%; max-height: 180px; object-fit: cover;
            border-radius: 8px; border: 1px solid var(--border); margin-top: 8px;
        }

        /* ── Buttons ────────────────────────────────────────── */
        .btn {
            padding: 9px 18px; border: none; border-radius: 7px; font-size: 0.85rem;
            font-weight: 600; cursor: pointer; transition: all 0.15s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--accent); color: #fff; flex: 1; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--text-secondary); }
        .btn-sm { padding: 6px 12px; font-size: 0.78rem; }
        .btn-icon {
            width: 28px; height: 28px; padding: 0; border: none; border-radius: 6px;
            background: rgba(108,92,231,0.15); color: var(--accent); font-size: 1.1rem;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.15s;
        }
        .btn-icon:hover { background: var(--accent); color: #fff; }
        .btn-icon.danger { background: rgba(255,82,82,0.15); color: var(--error); }
        .btn-icon.danger:hover { background: var(--error); color: #fff; }
        .btn-row { display: flex; gap: 8px; }

        /* ── Spinner ────────────────────────────────────────── */
        .spinner {
            width: 14px; height: 14px; border: 2px solid transparent;
            border-top-color: currentColor; border-radius: 50%;
            animation: spin 0.6s linear infinite; display: none;
        }
        .loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Right panel ────────────────────────────────────── */
        .results-panel {
            flex: 1; overflow-y: auto; padding: 16px;
            display: grid; grid-template-columns: repeat(5, 1fr);
            grid-auto-rows: min-content;
            gap: 36px 16px; align-content: start; align-items: start;
        }
        .result-card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; overflow: hidden; cursor: pointer;
            transition: all 0.15s;
        }
        .result-card:hover {
            border-color: var(--accent); transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108,92,231,0.15);
        }
        .result-card .frame-preview {
            width: 100%; aspect-ratio: 16/9; background: #12121a;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); font-size: 0.8rem; overflow: hidden;
        }
        .result-card .frame-preview img { width: 100%; height: 100%; object-fit: cover; }
        .result-card .card-info { padding: 10px 12px; }
        .result-card .video-id { font-size: 0.68rem; color: var(--accent); font-weight: 600; margin-bottom: 3px; }
        .result-card .frame-meta {
            font-size: 0.7rem; color: var(--text-secondary);
            display: flex; justify-content: space-between;
        }
        .result-card .scores { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
        .score-badge {
            background: rgba(108,92,231,0.15); color: var(--accent);
            padding: 2px 7px; border-radius: 4px; font-size: 0.66rem; font-weight: 500;
        }
        .score-badge.best { background: rgba(0,214,143,0.15); color: var(--success); }

        .event-timeline {
            display: flex; gap: 4px; margin-top: 6px; overflow-x: auto;
            padding: 4px 0;
        }
        .timeline-event {
            flex-shrink: 0; width: 56px; text-align: center; cursor: pointer;
            border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
            transition: border-color 0.15s;
        }
        .timeline-event:hover { border-color: var(--accent); }
        .timeline-event img { width: 56px; height: 32px; object-fit: cover; display: block; }
        .timeline-label {
            font-size: 0.55rem; color: var(--text-secondary); display: block;
            padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .trake-card .card-info { padding-bottom: 6px; }
        .answer-text {
            margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border);
            font-size: 0.75rem; color: var(--text); line-height: 1.35;
        }
        .answer-label { color: var(--text-secondary); font-weight: 600; }

        /* ── Empty state ────────────────────────────────────── */
        .empty-state {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 60px 20px;
            color: var(--text-secondary); text-align: center;
            grid-column: 1 / -1;
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.35; }

        /* ── CSV export panel ───────────────────────────────── */
        .csv-export-panel {
            background: var(--panel); border-top: 1px solid var(--border);
            padding: 10px 16px; flex-shrink: 0; display: none;
        }
        .csv-export-panel.visible { display: block; }
        .csv-export-inner {
            display: flex; align-items: flex-start; gap: 10px;
        }
        .csv-export-panel textarea {
            flex: 1; min-height: 48px; max-height: 90px; resize: vertical;
            background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
            color: var(--text); font-size: 0.72rem; font-family: monospace;
            padding: 8px 10px; line-height: 1.4;
        }
        .csv-actions { display: flex; gap: 6px; flex-shrink: 0; padding-top: 2px; }

        /* ── Video modal ────────────────────────────────────── */
        .video-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.82);
            display: none; align-items: center; justify-content: center;
            z-index: 3000; padding: 24px;
        }
        .video-modal.open { display: flex; }
        .video-modal-content {
            width: min(960px, 100%); background: var(--panel);
            border: 1px solid var(--border); border-radius: 12px;
            overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,0.45);
            position: relative;
        }
        .video-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.85rem;
        }
        .video-modal-header .meta { color: var(--text-secondary); font-size: 0.78rem; }
        .video-modal video { width: 100%; max-height: 70vh; background: #000; display: block; }
        .frame-overlay {
            position: absolute; bottom: 12px; left: 12px;
            background: rgba(0,0,0,0.72); color: #fff;
            padding: 4px 10px; border-radius: 6px;
            font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
            pointer-events: none; z-index: 10;
        }
        .video-modal-actions {
            display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
        }
        .btn-close {
            background: transparent; border: none; color: var(--text-secondary);
            font-size: 1.2rem; cursor: pointer; padding: 4px 8px;
        }
        .btn-close:hover { color: var(--text); }

        /* ── Toast ──────────────────────────────────────────── */
        .toast {
            position: fixed; bottom: 20px; right: 20px; padding: 12px 20px;
            border-radius: 8px; font-size: 0.85rem; z-index: 4000;
            animation: slideIn 0.3s;
        }
        .toast.error { background: var(--error); color: #fff; }
        .toast.ok { background: var(--success); color: var(--bg); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── TRAKE event list ───────────────────────────────── */
        .event-row { display: flex; gap: 6px; align-items: center; }
        .event-row input { flex: 1; }
    </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════ HEADER -->
<div class="header">
    <h1>🎬 Video Competition</h1>
    <div class="tabs" id="tabBar">
        <button class="active" data-mode="tkis">TKIS</button>
        <button data-mode="qa">Q&A</button>
        <button data-mode="trake">TRAKE</button>
    </div>
    <div class="header-right">
        <a href="/process">Process</a>
        <a href="/batch_answer.html">Batch</a>
        <span><span class="status-dot" id="statusDot"></span><span id="statusText">Checking...</span></span>
    </div>
</div>

<!-- ════════════════════════════════════════════════════════════ MAIN -->
<div class="main-container">

    <!-- ── LEFT PANEL ─────────────────────────────────────── -->
    <div class="control-panel">

        <!-- TKIS Controls -->
        <div class="mode-controls active" id="tkisControls">
            <div>
                <label>Search Mode</label>
                <select id="tkisSearchMode">
                    <option value="text" selected>Text query</option>
                    <option value="image">Image query</option>
                </select>
            </div>
            <div id="tkisTextBox">
                <label>Description</label>
                <textarea id="tkisQuery" placeholder="Describe the scene...&#10;e.g. 'a person presenting slides'"></textarea>
            </div>
            <div id="tkisImageBox" style="display:none">
                <label>Upload image</label>
                <div class="upload-zone" id="tkisUploadZone">
                    <input id="tkisImageInput" type="file" accept="image/*">
                    <span>Click to upload image</span>
                </div>
                <div id="tkisImagePreview" style="display:none">
                    <img id="tkisImageThumb" src="" alt="preview">
                </div>
            </div>
            <div>
                <label>Top-K</label>
                <select id="tkisTopK">
                    <option value="5">5</option><option value="10">10</option>
                    <option value="20">20</option><option value="50">50</option>
                    <option value="100" selected>100</option>
                </select>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="tkisSearchBtn" onclick="doTkisSearch()">
                    <span class="spinner"></span>Search
                </button>
                <button class="btn btn-secondary" onclick="clearResults()">Clear</button>
            </div>
            <div style="border-top:1px solid var(--border);padding-top:12px">
                <label>CSV Helper</label>
                <div class="btn-row" style="margin-bottom:8px">
                    <button class="btn btn-primary btn-sm" onclick="buildTkisCsv()">Build Row</button>
                    <button class="btn btn-secondary btn-sm" onclick="copyCsv()">Copy</button>
                    <button class="btn btn-secondary btn-sm" onclick="downloadCsv()">Download</button>
                </div>
                <textarea id="tkisCsvPreview" readonly placeholder="video_id, frame_idx" style="width:100%;min-height:80px;max-height:140px;resize:vertical;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.72rem;font-family:monospace;padding:8px;line-height:1.4"></textarea>
            </div>
        </div>

        <!-- Q&A Controls -->
        <div class="mode-controls" id="qaControls">
            <div>
                <label>Description</label>
                <textarea id="qaDescription" placeholder="Describe the video content..."></textarea>
            </div>
            <div>
                <label>Question</label>
                <input type="text" id="qaQuestion" placeholder="What are you asking?">
            </div>
            <div>
                <label>Top-K</label>
                <select id="qaTopK">
                    <option value="5">5</option><option value="10">10</option>
                    <option value="20">20</option><option value="50">50</option>
                    <option value="100" selected>100</option>
                </select>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="qaSearchBtn" onclick="doQaSearch()">
                    <span class="spinner"></span>Search
                </button>
                <button class="btn btn-secondary" onclick="clearResults()">Clear</button>
            </div>
        </div>

        <!-- TRAKE Controls -->
        <div class="mode-controls" id="trakeControls">
            <div>
                <label>Main Description</label>
                <textarea id="trakeDescription" placeholder="Overall video description..."></textarea>
            </div>
            <div>
                <label>Events (in order)</label>
                <div id="trakeEventList"></div>
                <button class="btn btn-secondary btn-sm" onclick="addTrakeEvent()" style="margin-top:6px;width:100%">+ Add Event</button>
            </div>
            <div>
                <label>Top-K (default 50)</label>
                <input type="number" id="trakeTopK" value="50" min="1" max="500">
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="trakeAlignBtn" onclick="doTrakeAlign()">
                    <span class="spinner"></span>Align Events
                </button>
                <button class="btn btn-secondary" onclick="clearResults()">Clear</button>
            </div>
        </div>

    </div>

    <!-- ── RIGHT PANEL (results grid) ─────────────────────── -->
    <div class="results-panel" id="resultsPanel">
        <div class="empty-state">
            <div class="icon">🔍</div>
            <p>Select a mode and search to begin</p>
        </div>
    </div>

</div>

<!-- ════════════════════════════════════════════════════════════ CSV EXPORT -->
<div class="csv-export-panel" id="csvExportPanel">
    <div class="csv-export-inner">
        <textarea id="csvExportText" readonly placeholder="CSV output will appear here..."></textarea>
        <div class="csv-actions">
            <button class="btn btn-primary btn-sm" onclick="copyCsv()">Copy All</button>
            <button class="btn btn-secondary btn-sm" onclick="downloadCsv()">Download CSV</button>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════════════════════════════ VIDEO MODAL -->
<div class="video-modal" id="videoModal" onclick="if(event.target===this)closeVideoModal()">
    <div class="video-modal-content">
        <div class="video-modal-header">
            <div>
                <div id="videoModalTitle">Video preview</div>
                <div class="meta" id="videoModalMeta"></div>
            </div>
            <button class="btn-close" type="button" onclick="closeVideoModal()">&times;</button>
        </div>
        <video id="videoPlayer" controls preload="auto"></video>
        <div class="frame-overlay" id="frameOverlay">Frame 0</div>
        <div class="video-modal-actions">
            <button class="btn btn-secondary" type="button" onclick="seekVideoRelative(-5)">-5s</button>
            <button class="btn btn-secondary" type="button" onclick="seekVideoRelative(5)">+5s</button>
            <button class="btn btn-primary" type="button" id="replayBtn" onclick="replayAtFrame()">Play frame</button>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════════════════════════════ SCRIPT -->
<script>
(function () {
    'use strict';

    const API = window.location.origin;
    let currentMode = 'tkis';
    let currentResults = [];
    let searchTimer = null;
    let csvRows = [];
    let videoModalState = { videoId: '', frameIdx: 0, timestamp: 0, fps: 25 };

    /* ── Utilities ──────────────────────────────────────────── */

    function $(id) { return document.getElementById(id); }

    function toast(msg, type) {
        const el = document.createElement('div');
        el.className = 'toast ' + (type || 'ok');
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
            .replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function escapeJs(s) {
        return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    }

    function setLoading(btnId, on) {
        const btn = $(btnId);
        if (!btn) return;
        btn.disabled = on;
        btn.classList.toggle('loading', on);
    }

    /* ── Status ─────────────────────────────────────────────── */

    async function checkStatus() {
        try {
            const r = await fetch(API + '/api/status');
            const d = await r.json();
            $('statusDot').className = 'status-dot';
            const n = d.milvus?.num_entities || 0;
            $('statusText').textContent = n > 0 ? `Ready \u00b7 ${n} frames` : 'Ready \u00b7 no videos';
        } catch (e) {
            $('statusDot').className = 'status-dot offline';
            $('statusText').textContent = 'Offline';
        }
    }

    /* ── Tab switching ──────────────────────────────────────── */

    document.querySelectorAll('#tabBar button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#tabBar button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            document.querySelectorAll('.mode-controls').forEach(el => el.classList.remove('active'));
            $(currentMode + 'Controls').classList.add('active');
            clearResults();
        });
    });

    /* ── TKIS Search ────────────────────────────────────────── */

    $('tkisSearchMode').addEventListener('change', function () {
        const isImage = this.value === 'image';
        $('tkisTextBox').style.display = isImage ? 'none' : 'block';
        $('tkisImageBox').style.display = isImage ? 'block' : 'none';
    });

    $('tkisUploadZone').addEventListener('click', () => $('tkisImageInput').click());
    $('tkisImageInput').addEventListener('change', function () {
        const file = this.files && this.files[0];
        const box = $('tkisImagePreview');
        if (!file) { box.style.display = 'none'; return; }
        $('tkisImageThumb').src = URL.createObjectURL(file);
        box.style.display = 'block';
    });

    $('tkisQuery').addEventListener('input', function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            if (this.value.trim().length >= 3) doTkisSearch();
        }, 800);
    });

    $('tkisQuery').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doTkisSearch(); }
    });

    window.doTkisSearch = async function () {
        const mode = $('tkisSearchMode').value;
        const topK = parseInt($('tkisTopK').value) || 100;
        setLoading('tkisSearchBtn', true);
        const t0 = performance.now();

        try {
            if (mode === 'image') {
                const file = $('tkisImageInput').files && $('tkisImageInput').files[0];
                if (!file) { toast('Select an image first', 'error'); return; }
                const fd = new FormData();
                fd.append('file', file);
                fd.append('top_k', String(topK));
                fd.append('use_full_funnel', 'true');
                fd.append('use_bm25', 'true');
                fd.append('use_cross_encoder', 'true');
                fd.append('expand_neighbors', 'false');
                fd.append('dedup', 'true');
                const r = await fetch(API + '/api/search-image', { method: 'POST', body: fd });
                if (!r.ok) throw new Error((await r.json()).detail || 'Image search failed');
                const d = await r.json();
                currentResults = d.results || [];
                renderTkis(d);
                updateCsvExport();
                return;
            }

            const q = $('tkisQuery').value.trim();
            if (!q) return toast('Enter a description', 'error');
            const r = await fetch(API + '/api/search?expand_neighbors=false&dedup=true', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: q, top_k: topK, model: 'fusion', task_type: 'KIS' }),
            });
            if (!r.ok) throw new Error((await r.json()).detail || 'Search failed');
            const d = await r.json();
            currentResults = d.results || [];
            renderTkis(d);
            updateCsvExport();
        } catch (e) {
            toast(e.message, 'error');
        } finally {
            setLoading('tkisSearchBtn', false);
        }
    };

    function renderTkis(data) {
        const p = $('resultsPanel');
        if (!data.results || !data.results.length) {
            p.innerHTML = '<div class="empty-state"><div class="icon">\u{1F615}</div><p>No results found</p></div>';
            return;
        }
        p.innerHTML = data.results.map((r, i) => `
            <div class="result-card" onclick="openVideoModal('${escapeJs(r.video_id)}',${r.frame_idx},${r.timestamp})">
                <div class="frame-preview">
                    <img src="/api/frame/${encodeURIComponent(r.video_id)}/${r.frame_idx}"
                         onerror="this.style.display='none';this.parentElement.textContent='Frame #${r.frame_idx}'"
                         alt="Frame ${r.frame_idx}" loading="lazy">
                </div>
                <div class="card-info">
                    <div class="video-id">${escapeHtml(r.video_id)}</div>
                    <div class="frame-meta">
                        <span>Frame ${r.frame_idx}</span>
                        <span>${r.timestamp.toFixed(1)}s</span>
                    </div>
                    <div class="scores">
                        <span class="score-badge">${r.clip_score.toFixed(3)}</span>
                        <span class="score-badge">${r.siglip2_score.toFixed(3)}</span>
                        <span class="score-badge best">\u2B50 ${(r.confidence || r.final_score || 0).toFixed(3)}</span>
                    </div>
                </div>
            </div>`).join('');
    }

    /* ── Q&A Search ─────────────────────────────────────────── */

    $('qaQuestion').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); doQaSearch(); }
    });

    window.doQaSearch = async function () {
        const description = $('qaDescription').value.trim();
        const question = $('qaQuestion').value.trim();
        const topK = parseInt($('qaTopK').value) || 100;
        if (!description) return toast('Enter a description', 'error');
        if (!question) return toast('Enter a question', 'error');
        setLoading('qaSearchBtn', true);

        try {
            const r = await fetch(API + '/api/qa/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ description, question, top_k: topK }),
            });
            if (!r.ok) throw new Error((await r.json()).detail || 'Q&A search failed');
            const d = await r.json();
            currentResults = d.results || [];
            renderQa(d, question);
            updateCsvExport();
        } catch (e) {
            toast(e.message, 'error');
        } finally {
            setLoading('qaSearchBtn', false);
        }
    };

    function renderQa(data, question) {
        const p = $('resultsPanel');
        if (!data.results || !data.results.length) {
            p.innerHTML = '<div class="empty-state"><div class="icon">\u{1F615}</div><p>No results found</p></div>';
            return;
        }
        p.innerHTML = data.results.map((r, i) => `
            <div class="result-card" onclick="openVideoModal('${escapeJs(r.video_id)}',${r.frame_idx},${r.timestamp || 0})">
                <div class="frame-preview">
                    <img src="/api/frame/${encodeURIComponent(r.video_id)}/${r.frame_idx}"
                         onerror="this.style.display='none';this.parentElement.textContent='Frame #${r.frame_idx}'"
                         alt="Frame ${r.frame_idx}" loading="lazy">
                </div>
                <div class="card-info">
                    <div class="video-id">${escapeHtml(r.video_id)}</div>
                    <div class="frame-meta">
                        <span>Frame ${r.frame_idx}</span>
                        <span>${(r.timestamp || 0).toFixed(1)}s</span>
                    </div>
                    <div class="scores">
                        <span class="score-badge">${r.clip_score.toFixed(3)}</span>
                        <span class="score-badge">${r.siglip2_score.toFixed(3)}</span>
                        <span class="score-badge best">\u2B50 ${(r.confidence || r.final_score || 0).toFixed(3)}</span>
                    </div>
                    ${r.answer ? `<div class="answer-text"><span class="answer-label">Answer:</span> ${escapeHtml(r.answer)}</div>` : ''}
                </div>
            </div>`).join('');
    }

    /* ── TRAKE ──────────────────────────────────────────────── */

    let trakeEventCount = 0;

    window.addTrakeEvent = function () {
        const list = $('trakeEventList');
        const idx = trakeEventCount++;
        const row = document.createElement('div');
        row.className = 'event-row';
        row.style.marginBottom = '6px';
        row.innerHTML = `
            <input type="text" id="trakeEvent_${idx}" placeholder="Event ${idx + 1} description..." style="flex:1">
            <button class="btn-icon danger" onclick="this.parentElement.remove()" title="Remove">&times;</button>`;
        list.appendChild(row);
    };
    addTrakeEvent();
    addTrakeEvent();
    addTrakeEvent();

    window.doTrakeAlign = async function () {
        const description = $('trakeDescription').value.trim();
        const topK = parseInt($('trakeTopK').value) || 50;
        if (!description) return toast('Enter a main description', 'error');

        const events = [];
        document.querySelectorAll('#trakeEventList .event-row input').forEach(inp => {
            const v = inp.value.trim();
            if (v) events.push(v);
        });
        if (!events.length) return toast('Add at least one event', 'error');
        setLoading('trakeAlignBtn', true);

        try {
            const r = await fetch(API + '/api/trake', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ description, events, top_k: topK }),
            });
            if (!r.ok) throw new Error((await r.json()).detail || 'TRAKE failed');
            const d = await r.json();
            currentResults = d.results || [];
            renderTrake(d, events);
            updateCsvExport();
        } catch (e) {
            toast(e.message, 'error');
        } finally {
            setLoading('trakeAlignBtn', false);
        }
    };

    function renderTrake(data, events) {
        const p = $('resultsPanel');
        if (!data.results || !data.results.length) {
            p.innerHTML = '<div class="empty-state"><div class="icon">\u{1F615}</div><p>No results found</p></div>';
            return;
        }

        if (data.event_mapping && Array.isArray(data.event_mapping)) {
            let mappingHtml = '<div style="grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">';
            data.event_mapping.forEach((m, i) => {
                mappingHtml += `<div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:0.78rem;flex:1;min-width:200px">
                    <div style="color:var(--accent);font-weight:600;margin-bottom:4px">Event ${i + 1}: ${escapeHtml(m.event || events[i] || '')}</div>
                    <div style="color:var(--text-secondary)">Frame ${m.frame_idx ?? m.best_frame ?? '?'} \u00b7 ${m.video_id ?? ''}</div>
                </div>`;
            });
            mappingHtml += '</div>';
            p.innerHTML = mappingHtml + data.results.map((r, i) => `
                <div class="result-card" onclick="openVideoModal('${escapeJs(r.video_id)}',${r.frame_idx},${r.timestamp || 0})">
                    <div class="frame-preview">
                        <img src="/api/frame/${encodeURIComponent(r.video_id)}/${r.frame_idx}"
                             onerror="this.style.display='none';this.parentElement.textContent='Frame #${r.frame_idx}'"
                             alt="Frame ${r.frame_idx}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <div class="video-id">${escapeHtml(r.video_id)}</div>
                        <div class="frame-meta">
                            <span>Frame ${r.frame_idx}</span>
                            <span>${(r.timestamp || 0).toFixed(1)}s</span>
                        </div>
                        <div class="scores">
                            <span class="score-badge best">\u2B50 ${(r.confidence || r.score || 0).toFixed(3)}</span>
                        </div>
                        ${r.event ? `<div class="answer-text"><span class="answer-label">Event:</span> ${escapeHtml(r.event)}</div>` : ''}
                    </div>
                </div>`).join('');
        } else {
            p.innerHTML = data.results.map((r, i) => {
                const eventTimeline = (r.event_frames || []).map((ef, ei) =>
                    `<div class="timeline-event" onclick="event.stopPropagation();openVideoModal('${escapeJs(r.video_id)}',${ef.frame_idx},0)" title="${escapeHtml(ef.event || 'Event ' + (ei+1))}">
                        <img src="/api/frame/${encodeURIComponent(r.video_id)}/${ef.frame_idx}" alt="E${ei+1}" loading="lazy" onerror="this.style.display='none'">
                        <span class="timeline-label">E${ei+1}: F${ef.frame_idx}</span>
                    </div>`
                ).join('');
                return `
                <div class="result-card trake-card" onclick="openVideoModal('${escapeJs(r.video_id)}',${r.frame_idx},${r.timestamp || 0})">
                    <div class="frame-preview">
                        <img src="/api/frame/${encodeURIComponent(r.video_id)}/${r.frame_idx}"
                             onerror="this.style.display='none';this.parentElement.textContent='Frame #${r.frame_idx}'"
                             alt="Frame ${r.frame_idx}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <div class="video-id">${escapeHtml(r.video_id)}</div>
                        <div class="frame-meta">
                            <span>Frame ${r.frame_idx}</span>
                            <span>${(r.timestamp || 0).toFixed(1)}s</span>
                            <span class="score-badge best">\u2B50 ${(r.confidence || r.score || 0).toFixed(3)}</span>
                        </div>
                        ${eventTimeline ? `<div class="event-timeline">${eventTimeline}</div>` : ''}
                    </div>
                </div>`;
            }).join('');
        }
    }

    /* ── Results helpers ─────────────────────────────────────── */

    window.clearResults = function () {
        currentResults = [];
        csvRows = [];
        $('resultsPanel').innerHTML =
            '<div class="empty-state"><div class="icon">\u{1F50D}</div><p>Select a mode and search to begin</p></div>';
        $('csvExportPanel').classList.remove('visible');
        $('csvExportText').value = '';
    };

    /* ── CSV generation ─────────────────────────────────────── */

    function buildTkisCsvRow(results) {
        return results
            .filter(r => r && r.video_id)
            .map(r => `${r.video_id}, ${r.frame_idx}`)
            .join('\n');
    }

    function buildQaCsvRow(results) {
        return results
            .filter(r => r && r.video_id)
            .map(r => {
                const ans = (r.answer || '').replace(/"/g, '""');
                return `${r.video_id}, ${r.frame_idx}, "${ans}"`;
            })
            .join('\n');
    }

    function buildTrakeCsvRow(results) {
        return results
            .filter(r => r && r.video_id)
            .map(r => {
                const frames = r.frames || r.aligned_frames || [r.frame_idx];
                return `${r.video_id}, ${frames.join(', ')}`;
            })
            .join('\n');
    }

    function updateCsvExport() {
        const panel = $('csvExportPanel');
        const textarea = $('csvExportText');
        if (!currentResults.length) {
            panel.classList.remove('visible');
            textarea.value = '';
            return;
        }
        panel.classList.add('visible');
        let csv = '';
        if (currentMode === 'tkis') {
            csv = buildTkisCsvRow(currentResults);
        } else if (currentMode === 'qa') {
            csv = buildQaCsvRow(currentResults);
        } else {
            csv = buildTrakeCsvRow(currentResults);
        }
        textarea.value = csv;
    }

    window.buildTkisCsv = function () {
        if (!currentResults.length) return toast('No results yet', 'error');
        updateCsvExport();
        toast('CSV row built', 'ok');
    };

    window.copyCsv = function () {
        const text = $('csvExportText').value;
        if (!text) return toast('No CSV to copy', 'error');
        navigator.clipboard.writeText(text)
            .then(() => toast('Copied to clipboard', 'ok'))
            .catch(() => toast('Clipboard unavailable', 'error'));
    };

    window.downloadCsv = function () {
        const text = $('csvExportText').value;
        if (!text) return toast('No CSV to download', 'error');
        const ext = currentMode === 'tkis' ? 'csv' : 'csv';
        const blob = new Blob([text + '\n'], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `competition_${currentMode}.csv`;
        a.click();
        toast('CSV downloaded', 'ok');
    };

    /* ── Video modal ────────────────────────────────────────── */

    window.openVideoModal = function (videoId, frameIdx, timestamp) {
        videoModalState = { videoId, frameIdx, timestamp: Number(timestamp) || 0, fps: 25 };
        const modal = $('videoModal');
        const player = $('videoPlayer');
        $('videoModalTitle').textContent = videoId + ' \u00b7 frame ' + frameIdx;
        $('videoModalMeta').textContent = 'Loading video...';
        $('frameOverlay').textContent = 'Frame ' + frameIdx;
        $('replayBtn').textContent = 'Play frame ' + frameIdx;

        player.pause();
        player.removeAttribute('src');
        player.load();

        player.ontimeupdate = function () {
            const cur = Math.round(player.currentTime * videoModalState.fps);
            $('frameOverlay').textContent = 'Frame ' + cur;
        };

        player.onloadedmetadata = function () {
            player.onloadedmetadata = null;
            $('videoModalMeta').textContent = 'Frame ' + frameIdx + ' \u00b7 Click "Play frame" to start';
        };

        player.src = API + '/api/video/' + encodeURIComponent(videoId) + '?v=' + Date.now();
        modal.classList.add('open');

        fetch(API + '/api/video/' + encodeURIComponent(videoId) + '/info')
            .then(r => r.ok ? r.json() : null)
            .then(info => {
                if (info) {
                    videoModalState.fps = info.fps || 25;
                    if (!videoModalState.timestamp && frameIdx >= 0) {
                        videoModalState.timestamp = frameIdx / videoModalState.fps;
                    }
                }
            })
            .catch(() => {});
    };

    window.closeVideoModal = function () {
        const player = $('videoPlayer');
        player.pause();
        player.ontimeupdate = null;
        player.removeAttribute('src');
        player.load();
        $('videoModal').classList.remove('open');
    };

    window.seekVideoRelative = function (delta) {
        const player = $('videoPlayer');
        player.currentTime = Math.max(0, player.currentTime + delta);
        const cur = Math.round(player.currentTime * videoModalState.fps);
        $('frameOverlay').textContent = 'Frame ' + cur;
    };

    window.replayAtFrame = function () {
        let t = videoModalState.timestamp;
        if (!t && videoModalState.fps > 0) t = videoModalState.frameIdx / videoModalState.fps;
        t = Math.max(0, t);
        const player = $('videoPlayer');
        $('frameOverlay').textContent = 'Frame ' + videoModalState.frameIdx;

        function doSeek() {
            player.pause();
            player.currentTime = t;
            player.onseeked = function () {
                player.onseeked = null;
                player.currentTime = t;
                player.play().catch(() => {});
            };
        }

        if (player.readyState >= 2) {
            doSeek();
        } else {
            player.oncanplay = function () {
                player.oncanplay = null;
                doSeek();
            };
        }
    };

    /* ── Keyboard shortcuts ─────────────────────────────────── */

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeVideoModal();
    });

    /* ── Init ───────────────────────────────────────────────── */

    checkStatus();
    setInterval(checkStatus, 30000);

})();
</script>
</body>
</html>
