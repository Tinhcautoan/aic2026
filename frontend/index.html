<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIC 2026 · Tìm &amp; nộp một đáp án</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a323d; --text:#e7ebf0; --muted:#8994a3;
  --accent:#4c9aff; --ok:#2ecc71; --bad:#ff5d5d; --warn:#f5b342;
  --card-min:200px;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
@media (max-width:1400px){.brand small{display:none}}
.top{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px}
.brand{font-weight:700;letter-spacing:.2px}
.brand small{color:var(--muted);font-weight:400;margin-left:6px}
.tabs{display:flex;gap:4px;background:var(--panel);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tab{border:0;background:transparent;padding:6px 10px;border-radius:7px;color:var(--muted);font-weight:600}
.tab[aria-selected=true]{background:var(--accent);color:#06121f}
.tab:hover:not([aria-selected=true]){color:var(--text)}
.spacer{flex:1}
.timer{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 10px}
.timer .clock{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;min-width:5.6em}
.timer .est{font-size:12px;color:var(--muted);line-height:1.2}
.timer .est b{color:var(--text);font-size:14px}
.bar{position:relative;height:4px;width:84px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ok);transition:width .25s linear,background .25s}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;display:flex;align-items:center;gap:8px}
.chip{max-width:250px}
.chip #dresText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{flex:none;width:9px;height:9px;border-radius:50%;background:#59626f}
.chip.on .dot{background:var(--ok)} .chip.warn .dot{background:var(--warn)} .chip.off .dot{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:8px}
.btn:hover{border-color:#3a4553}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:transparent;color:var(--bad);border-color:#5a2b2f}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.icon{padding:6px 9px}

/* ---------- query ---------- */
main{flex:1;width:100%;max-width:1800px;margin:0 auto;padding:12px 16px 200px}
.query{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.query textarea,.query input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical}
.query textarea{min-height:64px}
.query textarea:focus,.query input:focus{border-color:var(--accent);outline:none}
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.qrow label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.en{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.en input{flex:1}
.hint{font-size:12px;color:var(--muted)}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin:12px 2px 8px;color:var(--muted);font-size:13px;min-height:20px}
.status b{color:var(--text)}
.err{background:#2a1517;border:1px solid #5a2b2f;color:#ffb3b3;border-radius:8px;padding:8px 12px;margin:10px 0}

/* ---------- result grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr));gap:10px}
.card{position:relative;padding:0;border:2px solid transparent;border-radius:9px;background:var(--panel);overflow:hidden;text-align:left;display:block}
.card:hover{border-color:#3a4553}
.card[aria-pressed=true]{border-color:var(--ok);box-shadow:0 0 0 2px rgba(46,204,113,.25)}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0a0d11}
.card .meta{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;font-size:12px}
.card .meta b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .rk{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);border-radius:5px;padding:1px 6px;font-size:11px}
.card .play{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.65);border:0;border-radius:5px;padding:1px 7px;font-size:12px}
.card .play:hover{background:var(--accent);color:#06121f}
.card.wrong img{filter:grayscale(1) brightness(.45)}
.card.wrong::after{content:"✗ đã nộp sai";position:absolute;inset:0 0 auto 0;top:38%;text-align:center;color:var(--bad);font-weight:700;pointer-events:none}
.skeleton{aspect-ratio:16/9;border-radius:9px;background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:300% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-100% 0}}

/* ---------- TRAKE rows ---------- */
.trow{background:var(--panel);border:2px solid transparent;border-radius:var(--r);margin-bottom:10px;padding:8px 10px 10px}
.trow.picked{border-color:var(--ok)}
.trow.wrong{opacity:.55}
.trow>header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.trow .rank{background:var(--panel2);border-radius:6px;padding:1px 8px;font-weight:700}
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,250px);gap:8px;overflow-x:auto;padding-bottom:4px}
.tcell{background:var(--panel2);border:2px solid transparent;border-radius:8px;overflow:hidden;font-size:12px}
.tcell.bad{border-color:var(--bad)}
.tcell img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0a0d11}
.tcell .ev{padding:4px 7px;color:var(--muted);height:2.9em;overflow:hidden}
.tcell .ev b{color:var(--accent)}
.tcell .ft{display:flex;justify-content:space-between;align-items:center;padding:0 7px 6px}
.tcell .swap{border:1px solid var(--line);background:transparent;border-radius:6px;padding:0 7px;font-size:11px;color:var(--muted)}
.tcell .swap:hover{color:var(--text);border-color:#3a4553}
.alts{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:6px;overflow-x:auto;margin-top:8px;padding:6px;background:var(--bg);border-radius:8px}
.alts button{padding:0;border:2px solid transparent;border-radius:7px;background:var(--panel2);overflow:hidden;font-size:11px;text-align:center}
.alts button[aria-pressed=true]{border-color:var(--ok)}
.alts img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}

/* ---------- answer bar ---------- */
.answer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,23,30,.98);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.answer .inner{max-width:1800px;margin:0 auto;display:grid;gap:8px}
.sel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.selthumbs{display:flex;gap:6px}
.selthumbs figure{margin:0;position:relative}
.selthumbs img{display:block;height:58px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#0a0d11}
.selthumbs figcaption{position:absolute;left:3px;bottom:2px;font-size:10px;background:rgba(0,0,0,.65);border-radius:4px;padding:0 4px}
.fields{display:grid;gap:5px;min-width:260px;flex:1}
.fields .row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.fields input[type=number],.fields input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.fields input[type=number]{width:110px}
.fields input#ans{flex:1;min-width:240px;font-size:15px}
.payload{color:var(--muted);font-size:12px;word-break:break-all}
.payload.bad{color:var(--bad)}
.acts{display:flex;gap:8px;align-items:center}
.submit{min-width:170px;padding:12px 20px;font-size:16px}
.verdict{border-radius:8px;padding:8px 12px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.verdict.ok{background:#12301f;color:#7dffa8;border:1px solid #1f6a3c}
.verdict.no{background:#3a1418;color:#ff9c9c;border:1px solid #7a2a31}
.verdict.wait{background:#33280f;color:#ffd27a;border:1px solid #6f5417}
.verdict small{font-weight:400;opacity:.85}

/* ---------- dialogs ---------- */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0;max-width:96vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:16px 18px;display:grid;gap:12px;min-width:min(520px,92vw)}
.dlg h2{margin:0;font-size:16px}
.dlg label{display:grid;gap:4px;color:var(--muted);font-size:12px}
.dlg input,.dlg select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text)}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;padding:6px;border-radius:7px;color:var(--muted)}
.seg button[aria-selected=true]{background:var(--panel2);color:var(--text)}
#viewer .dlg{min-width:min(1100px,94vw)}
#viewer video{width:100%;max-height:62vh;background:#000;border-radius:8px}
.vmsg{color:var(--warn);font-size:13px}
.vframe{display:block;width:100%;max-height:62vh;object-fit:contain;background:#000;border-radius:8px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:128px;gap:6px;overflow-x:auto;padding-bottom:4px}
.strip button{padding:0;border:2px solid transparent;background:var(--panel2);border-radius:7px;overflow:hidden;font-size:11px}
.strip button[aria-pressed=true]{border-color:var(--accent)}
.strip img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.drawer{position:fixed;right:12px;bottom:calc(var(--barh,120px) + 14px);z-index:31;width:min(460px,92vw);max-height:46vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.drawer h3{margin:0 0 6px;font-size:13px}
.drawer ol{margin:0;padding-left:18px;display:grid;gap:5px;font-size:12px}
.tag{border-radius:5px;padding:0 6px;font-size:11px;font-weight:700}
.tag.CORRECT{background:#12301f;color:#7dffa8}.tag.WRONG{background:#3a1418;color:#ff9c9c}
.tag.other{background:#33280f;color:#ffd27a}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}
.empty kbd,.hint kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:12px ui-monospace,Consolas,monospace;color:var(--text)}
</style>
</head>
<body>

<header class="top">
  <div class="brand">AIC 2026<small>nộp 1 đáp án</small></div>
  <div class="tabs" role="tablist" id="tabs" aria-label="Loại truy vấn">
    <button class="tab" role="tab" data-task="tkis">Textual KIS</button>
    <button class="tab" role="tab" data-task="vkis">Video KIS</button>
    <button class="tab" role="tab" data-task="qa">Q&amp;A</button>
    <button class="tab" role="tab" data-task="trake">TRAKE</button>
  </div>
  <div class="spacer"></div>
  <div class="timer" title="Ước tính theo đồng hồ của máy này; đồng hồ chính thức là của DRES">
    <span class="clock" id="clock">0:00 / 5:00</span>
    <div><div class="bar"><i id="clockBar"></i></div><div class="est" id="est">Bấm “Câu mới” khi câu bắt đầu</div></div>
    <button class="btn" id="btnNew" title="Bắt đầu câu mới: xóa đáp án đã chọn, đặt lại đồng hồ và danh sách đã nộp">⟲ Câu mới</button>
  </div>
  <button class="chip off" id="dresChip" title="Đăng nhập / chọn evaluation của DRES"><span class="dot"></span><span id="dresText">DRES: chưa đăng nhập</span></button>
  <button class="btn icon" id="btnLog" title="Nhật ký nộp của câu này">🧾 <span id="logN">0</span></button>
  <button class="btn icon" id="btnCfg" title="Cài đặt">⚙</button>
</header>

<main>
  <section class="query" id="query"></section>
  <div class="status" id="status" aria-live="polite"></div>
  <div id="error" hidden></div>
  <section id="results"></section>
</main>

<footer class="answer" id="answer">
  <div class="inner">
    <div class="verdict" id="verdict" hidden role="status" aria-live="assertive"></div>
    <div class="empty" id="barEmpty" style="padding:10px 0">Chưa chọn đáp án — bấm vào một khung hình để chọn. Chỉ <b>một</b> đáp án được nộp mỗi lần.</div>
    <div class="sel" id="barSel" hidden>
      <div class="selthumbs" id="barThumbs"></div>
      <div class="fields">
        <div class="row">
          <b id="barVideo"></b>
          <span id="barTimeWrap">tại <input type="number" id="selMs" min="0" step="100" aria-label="Thời điểm (ms)"> ms <span class="muted" id="barTimeHuman"></span></span>
        </div>
        <div class="row" id="barAnsWrap" hidden>
          <input type="text" id="ans" placeholder="Câu trả lời Q&A (Enter để nộp)" autocomplete="off" aria-label="Câu trả lời">
        </div>
        <code class="payload mono" id="barPayload"></code>
      </div>
      <div class="acts">
        <button class="btn" id="btnView" title="Xem video ở thời điểm này">▶ Xem</button>
        <button class="btn" id="btnClear" title="Bỏ chọn (Esc)">✕</button>
        <button class="btn primary submit" id="btnSubmit" title="Nộp lên DRES (Ctrl+Shift+Enter)">NỘP ĐÁP ÁN</button>
      </div>
    </div>
  </div>
</footer>

<aside class="drawer" id="drawer" hidden>
  <h3>Đã nộp trong câu này</h3>
  <ol id="logList"></ol>
</aside>

<!-- DRES login -->
<dialog id="dresDlg">
  <form class="dlg" method="dialog" id="dresForm" onsubmit="return false">
    <h2>Kết nối DRES</h2>
    <label>Địa chỉ server
      <input type="text" id="dBase" placeholder="https://eventretrieval.one" autocomplete="off">
    </label>
    <div class="seg" id="dMode" role="tablist">
      <button type="button" role="tab" data-m="login" aria-selected="true">Username / mật khẩu</button>
      <button type="button" role="tab" data-m="session" aria-selected="false">Dán sessionId</button>
    </div>
    <div id="dLogin" style="display:grid;gap:10px">
      <label>Username <input type="text" id="dUser" autocomplete="username"></label>
      <label>Mật khẩu <input type="password" id="dPass" autocomplete="current-password"></label>
    </div>
    <div id="dSess" style="display:none">
      <label>sessionId (lấy ở trang User của DRES) <input type="text" id="dSid" autocomplete="off"></label>
    </div>
    <label id="dEvWrap" hidden>Evaluation
      <select id="dEval"></select>
    </label>
    <label>Tên collection (chỉ điền khi DRES báo “collection name is required”; nếu không, để trống)
      <input type="text" id="dColl" placeholder="vd. tên collection BTC cung cấp" autocomplete="off">
    </label>
    <div id="dMsg" class="hint"></div>
    <div class="row">
      <button type="button" class="btn danger" id="dOut" hidden>Đăng xuất</button>
      <button type="button" class="btn" id="dRefresh" hidden>↻ Làm mới danh sách</button>
      <button type="button" class="btn" id="dClose">Đóng</button>
      <button type="submit" class="btn primary" id="dGo">Kết nối</button>
    </div>
    <div class="hint">Mật khẩu chỉ được gửi tới DRES qua server này và không được lưu vào ổ đĩa.</div>
  </form>
</dialog>

<!-- Settings -->
<dialog id="cfgDlg">
  <form class="dlg" method="dialog">
    <h2>Cài đặt</h2>
    <label>Kích thước ảnh nhỏ <input type="range" id="cThumb" min="130" max="360" step="10"></label>
    <label>Số kết quả hiển thị (KIS / Q&amp;A) <select id="cTop"><option>30</option><option>60</option><option>100</option><option>150</option></select></label>
    <label>Khoảng nộp ± giây quanh thời điểm chọn (KIS). 0 = nộp đúng một thời điểm
      <input type="number" id="cPm" min="0" max="30" step="1"></label>
    <label>TRAKE: FRAME_ID nộp lên là
      <select id="cId"><option value="ms">mili-giây (ms) — mặc định</option><option value="frame">chỉ số frame gốc của video</option></select></label>
    <label style="display:flex;align-items:center;gap:8px;grid-template-columns:none"><input type="checkbox" id="cLive"> Tự tìm khi ngừng gõ (≈0,7 giây)</label>
    <label style="display:flex;align-items:center;gap:8px;grid-template-columns:none"><input type="checkbox" id="cConfirm"> Hỏi xác nhận (bấm NỘP hai lần)</label>
    <div class="row"><button class="btn primary" value="close">Xong</button></div>
  </form>
</dialog>

<!-- Video / frame viewer -->
<dialog id="viewer">
  <div class="dlg">
    <div style="display:flex;align-items:center;gap:12px">
      <h2 id="vTitle" style="flex:1">Video</h2>
      <button class="btn" id="vClose">Đóng (Esc)</button>
    </div>
    <video id="vVideo" controls preload="metadata" playsinline></video>
    <img id="vFrame" class="vframe" alt="keyframe" hidden>
    <div class="vmsg" id="vMsg" hidden></div>
    <div class="row" style="justify-content:flex-start;align-items:center" id="vActs">
      <button class="btn" id="vBack">−1 giây</button>
      <button class="btn" id="vFwd">+1 giây</button>
      <button class="btn primary" id="vPick">Chọn thời điểm này</button>
      <span class="muted" id="vNow"></span>
    </div>
    <div class="strip" id="vStrip" aria-label="Các khung hình lân cận"></div>
  </div>
</dialog>

<script>
'use strict';
/* =====================================================================
   API used by this page (implemented by api/app.py):
     GET  /api/status
     POST /api/search        {query, top_k, en_override?}
     POST /api/trake         {events[], top_k}
     GET  /api/neighbors/{video}/{frame}?n=
     GET  /api/thumb/{video}/{frame}      (JPEG)
     GET  /api/video/{video}              (Range-capable mp4)
     GET  /api/dres/state        POST /api/dres/{login|session|refresh|select|logout|new_query|submit}
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k in n && k !== 'list') { try { n[k] = v; } catch { n.setAttribute(k, v); } }
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('aic.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('aic.' + k, JSON.stringify(v)); } catch { /* private mode */ } },
};
const fmtTime = ms => {
  const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
};
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90"><rect width="160" height="90" fill="#10151b"/>' +
  '<text x="80" y="49" fill="#59626f" font-family="sans-serif" font-size="9" text-anchor="middle">không có ảnh</text></svg>');

function errText(j) {                     // FastAPI: detail is a string, or a list of {msg} for 422

async function api(path, opts = {}, timeout = 20000) {
  const ctrl = opts.signal ? null : new AbortController();

    const r = await fetch(path, {
      ...opts, signal: opts.signal || ctrl.signal,
      headers: opts.body ? { 'Content-Type': 'application/json', ...(opts.headers || {}) } : opts.headers,
    });
    let j = null;
    try { j = await r.json(); } catch { /* not JSON */ }
    if (!r.ok) throw Object.assign(new Error(errText(j) || `HTTP ${r.status}`), { status: r.status, body: j });
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    if (e instanceof TypeError) throw new Error('Không kết nối được server tìm kiếm (đang chạy chưa?)');
    throw e;

  const T = TASKS[S.task].T, t = elapsed(), running = S.timer.t0 != null && S.timer.t1 == null;

  const frac = Math.min(1, t / T), bar = $('#clockBar');
  bar.style.width = (100 * (1 - frac)) + '%';
  bar.style.background = frac < .6 ? 'var(--ok)' : frac < .85 ? 'var(--warn)' : 'var(--bad)';
  const est = $('#est');

function parseEvents(text) {
  const t = (text || '').trim();
  if (!t) return [];
  if (/\(\s*\d+\s*\)/.test(t)) {                       // "(1) ... (2) ..." pasted as one paragraph
    return t.split(/\(\s*\d+\s*\)/).slice(1).map(s => s.trim().replace(/[.,;]+$/, '')).filter(Boolean);
  }
  return t.split(/\r?\n/).map(s => s.replace(/^\s*\d+[.)]\s*/, '').trim()).filter(Boolean);
}

let liveTimer = null;

  clearTimeout(liveTimer);

  liveTimer = setTimeout(() => {

    if (ok) doSearch({ live: true });
  }, 700);
}

async function doSearch(opts = {}) {
  clearTimeout(liveTimer);
  const k = kind(), task = S.task, seq = ++S.seq;
  if (S.ctrl) S.ctrl.abort();
  const ctrl = S.ctrl = new AbortController();
  let path, body;
  if (k === 'trake') {
    const events = parseEvents(S.text.trake);
    if (!events.length) { setError('Chưa có sự kiện nào'); return; }
    path = '/api/trake';
    body = S.legacy ? { description: events.join('; ').slice(0, 2000), events, top_k: 20 } : { events, top_k: 20 };
  } else {
    const q = S.text[task].trim();
    if (!q) { setError('Chưa nhập mô tả'); return; }
    if (S.legacy) { path = '/api/search?expand_neighbors=false'; body = { query: q.slice(0, 500), top_k: Math.min(S.cfg.top, 100) }; }
    else { path = '/api/search'; body = { query: q, top_k: S.cfg.top }; if (opts.en) body.en_override = opts.en; }
  }
  ensureTimer(true); setError('');
  if (!opts.live) showSkeleton();
  const t0 = performance.now();
  try {
    let r = await api(path, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal });
    if (S.legacy) r = k === 'trake' ? normTrake(r) : normSearch(r);
    if (seq !== S.seq) return;                                  // a newer search superseded this one
    r._client_ms = performance.now() - t0;
    if (k === 'trake') for (const v of r.results) v.chosen = v.frames.map(f => ({ ...f }));
    S.data[task] = r;
    if (S.sel) S.sel = null;

  }
}
// ---- the previous backend (api/app.py before the PE-Core-only rewrite) answers in a different shape ----
function normSearch(raw) {

    const t = x.timestamp, hasT = typeof t === 'number' && (t > 0 || x.frame_idx === 0);
    return {
      video_id: x.video_id, frame_idx: x.frame_idx,
      ms: Math.round((hasT ? t : x.frame_idx / 25) * 1000),
      fps: t > 0 && x.frame_idx > 0 ? x.frame_idx / t : 25,
      score: x.confidence ?? x.final_score ?? 0,

}
function normTrake(raw) {

    const evs = v.event_frames && v.event_frames.length ? v.event_frames : (v.frames || []).map(f => ({ event: '', frame_idx: f, score: 0 }));
    return {
      video_id: v.video_id, fps, score: v.score ?? 0,
      frames: evs.map(e => ({ event: e.event, frame_idx: e.frame_idx, ms: Math.round(e.frame_idx / fps * 1000), score: e.score ?? 0, alts: [] })),

function selectKis(it) {

function selectTrake(v, row, keepAltEvent = -1) {

function currentPayloadReq() {

  }
  if (k === 'qa') return { kind: 'qa', video_id: s.video_id, answer: S.answer, time_ms: Math.round(s.ms) };

  if (p.kind === 'trake') {
    for (let i = 1; i < p.frames.length; i++) if (p.frames[i] <= p.frames[i - 1]) return 'Các khung phải tăng dần theo thời gian';
    if (p.frames.some(f => f < 0)) return 'Có sự kiện chưa có khung';

function updatePayload() {
  const p = currentPayloadReq(), bad = validity(p);
  const box = $('#barPayload');
  box.textContent = p ? previewText(p) + (bad ? `   ⚠ ${bad}` : '') : '';
  box.classList.toggle('bad', !!bad);
  const b = $('#btnSubmit');
  const dupe = p && S.sel && S.log.some(x => x.ckey === previewText(p) && x.verdict !== 'ERROR');
  b.disabled = !!bad || !!dupe || !S.dres.logged_in;
  b.textContent = S.confirmArmed ? 'BẤM LẠI ĐỂ NỘP' : (dupe ? 'ĐÃ NỘP' : 'NỘP ĐÁP ÁN');
  b.title = !S.dres.logged_in ? 'Đăng nhập DRES trước' : (dupe ? 'Đáp án này đã nộp trong câu này' : 'Nộp lên DRES (Ctrl+Shift+Enter)');
}
function syncBarHeight() {
  requestAnimationFrame(() => document.documentElement.style.setProperty('--barh', $('#answer').offsetHeight + 'px'));
}

/* ----------------------------------------------------------------- submit */
let submitting = false;
async function submit(force = false) {
  const p = currentPayloadReq(), bad = validity(p);
  if (!p || bad || submitting) return;
  if (!S.dres.logged_in) { openDres(); return; }
  // the hotkey bypasses the (disabled) button, so the duplicate rule must live here too
  if (!force && S.log.some(x => x.ckey === previewText(p) && x.verdict !== 'ERROR')) return;
  if (S.cfg.confirm && !S.confirmArmed) {
    S.confirmArmed = true; updatePayload();
    setTimeout(() => { if (S.confirmArmed) { S.confirmArmed = false; updatePayload(); } }, 3000);
    return;
  }
  S.confirmArmed = false; submitting = true;
  const btn = $('#btnSubmit'); btn.disabled = true; btn.textContent = 'Đang nộp…';
  const wrongKey = kind() === 'trake' ? trakeKey(S.sel.video_id, S.sel.chosen) : S.sel.key;
  try {
    ensureTimer();
    const res = await post('/api/dres/submit', { ...p, force }, 15000);
    const item = { ckey: previewText(p), summary: res.summary || previewText(p), verdict: res.verdict, description: res.description, ms: res.latency_ms, at: elapsed() };
    if (!res.duplicate && res.verdict !== 'ERROR') S.log.push(item);   // a rejected request was never judged
    showVerdict(res, wrongKey);
  } catch (e) {
    showVerdict({ verdict: 'ERROR', description: e.message, ok: false }, wrongKey);
    if (e.status === 401) refreshDres();
  } finally { submitting = false; renderLog(); updatePayload(); tickTimer(); }
}
function showVerdict(res, wrongKey) {
  const v = $('#verdict'); v.hidden = false; v.className = 'verdict';
  const verdict = res.verdict;
  let head;
  if (res.duplicate) { v.classList.add('wait'); head = 'Đã nộp đáp án này rồi — không nộp lại'; }
  else if (verdict === 'CORRECT') {
    v.classList.add('ok'); head = '✓ ĐÚNG'; if (S.timer.t1 == null) S.timer.t1 = performance.now();
  } else if (verdict === 'WRONG') {
    v.classList.add('no'); head = '✗ SAI  (−10 điểm)'; S.wrong.add(wrongKey); paintWrong();
  } else if (verdict === 'INDETERMINATE' || verdict === 'UNDECIDABLE') { v.classList.add('wait'); head = 'Đang chờ giám khảo chấm'; }
  else { v.classList.add('no'); head = verdict === 'UNKNOWN' ? '? Chưa rõ DRES đã nhận chưa' : 'Không nộp được';
    if (/collection/i.test(res.description || '')) head += ' — bấm chấm DRES, điền “Tên collection” rồi nộp lại'; }
  v.replaceChildren(...[head, el('small', {}, [res.description, res.latency_ms != null ? `${Math.round(res.latency_ms)} ms` : ''].filter(Boolean).join(' · ')),
    verdict === 'CORRECT' ? el('button', { class: 'btn', onclick: startQuery }, 'Câu tiếp theo ⟲') : null,
    verdict === 'UNKNOWN' ? el('button', { class: 'btn', onclick: () => submit(true) }, 'Nộp lại (đã kiểm tra DRES)') : null].filter(Boolean));
  syncBarHeight();
}
function paintWrong() {
  if (kind() === 'trake') return renderResults();
  $$('.card').forEach(c => c.classList.toggle('wrong', S.wrong.has(c.dataset.k)));
}
function renderLog() {
  $('#logN').textContent = S.log.length;
  const ol = $('#logList'); ol.replaceChildren();
  S.log.forEach(x => ol.append(el('li', {},
    el('span', { class: 'tag ' + (x.verdict === 'CORRECT' || x.verdict === 'WRONG' ? x.verdict : 'other') }, x.verdict), ' ',
    el('span', { class: 'mono' }, x.summary), ' ', el('span', { class: 'muted' }, `· ${fmtTime(x.at * 1000)}`))));
  if (!S.log.length) ol.append(el('li', { class: 'muted' }, 'Chưa nộp gì.'));
}

/* ----------------------------------------------------------------- viewer */
let vctx = null, viewerTimer = null;
const bigURL = (v, f) => thumbURL(v, f) + (S.legacy ? '' : '?w=1280');
function showKeyframe(v, f) { const i = $('#vFrame'); i.onerror = () => { i.onerror = null; i.src = PLACEHOLDER; }; i.src = bigURL(v, f); i.hidden = false; $('#vVideo').hidden = true; }
async function openViewer(it) {
  const dlg = $('#viewer'), vid = $('#vVideo'), msg = $('#vMsg'), strip = $('#vStrip');
  vctx = { ...it, ms: it.ms, key: keyOf(it.video_id, it.frame_idx) };
  $('#vTitle').textContent = `${it.video_id} · ${fmtTime(it.ms)}`;
  msg.hidden = true; strip.replaceChildren();
  $('#vActs').hidden = kind() === 'trake';
  vid.removeAttribute('src'); vid.load();
  // The video is a convenience, the keyframe is the fallback: any failure (file missing, drive dropped, codec, too slow)
  // swaps the player for the big keyframe of the selected moment.
  const fImg = $('#vFrame'); fImg.hidden = true; vid.hidden = false; clearTimeout(viewerTimer); $('#vNow').textContent = '';
  const myKey = vctx.key;
  const fallback = why => {
    if (!dlg.open || !vctx || vctx.video_id !== it.video_id) return;
    showKeyframe(vctx.video_id, vctx.frame_idx); msg.hidden = false; msg.textContent = why + ' → đang hiện keyframe thay cho video. Bấm ảnh nhỏ bên dưới để đổi thời điểm.';
  };
  vid.onloadedmetadata = () => { vid.currentTime = Math.max(0, it.ms / 1000); };
  vid.onloadeddata = () => { clearTimeout(viewerTimer); };
  vid.onerror = () => fallback('Không phát được video (thiếu file, lỗi ổ đĩa hoặc codec)');
  viewerTimer = setTimeout(() => { if (vid.readyState < 2) fallback('Video tải quá chậm'); }, 6000);
  vid.ontimeupdate = () => { $('#vNow').textContent = 'Đang ở ' + fmtTime(vid.currentTime * 1000) + ` (${Math.round(vid.currentTime * 1000)} ms)`; };
  vid.src = `/api/video/${encodeURIComponent(it.video_id)}`;
  if (!dlg.open) dlg.showModal();
  if (S.legacy) return;
  try {
    const n = await api(`/api/neighbors/${encodeURIComponent(it.video_id)}/${it.frame_idx}?n=14`);
    strip.replaceChildren();
    for (const f of n.items) {
      strip.append(el('button', {
        'aria-pressed': f.frame_idx === it.frame_idx ? 'true' : 'false', title: `frame ${f.frame_idx}`,
        onclick: () => {
          $$('#vStrip button').forEach(b => b.setAttribute('aria-pressed', 'false'));
          strip.querySelector(`[title="frame ${f.frame_idx}"]`)?.setAttribute('aria-pressed', 'true');
          vid.currentTime = f.ms / 1000; vctx = { ...vctx, ms: f.ms, frame_idx: f.frame_idx, key: keyOf(it.video_id, f.frame_idx) };
          if (!$('#vFrame').hidden) showKeyframe(it.video_id, f.frame_idx);
        },
        ondblclick: () => { vctx = { ...vctx, ms: f.ms, frame_idx: f.frame_idx, key: keyOf(it.video_id, f.frame_idx) }; pickFromViewer(); },
      }, img(it.video_id, f.frame_idx), el('div', {}, fmtTime(f.ms))));
    }
    strip.querySelector('[aria-pressed=true]')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  } catch { /* strip is optional */ }
}
function pickFromViewer() {
  if (!vctx || kind() === 'trake') return;
  const ms = Math.round($('#vVideo').currentTime * 1000);
  const player = $('#vVideo'), playerOk = !player.hidden && player.readyState >= 2;
  const useNow = playerOk && (!player.paused || Math.abs(ms - vctx.ms) > 400) ? ms : vctx.ms;
  const fps = vctx.fps || 25;
  const frame = Math.round(useNow / 1000 * fps);
  selectKis({ video_id: vctx.video_id, frame_idx: useNow === vctx.ms ? vctx.frame_idx : frame, ms: useNow, fps: vctx.fps, score: 0 });
  $('#viewer').close();
}

/* ------------------------------------------------------------------- DRES */
function renderDresChip() {
  const d = S.dres, chip = $('#dresChip'), t = $('#dresText');
  chip.className = 'chip ' + (!d.logged_in ? 'off' : d.evaluation_id ? 'on' : 'warn');
  if (!d.logged_in) t.textContent = 'DRES: chưa đăng nhập';
  else {
    const ev = d.evaluations.find(e => e.id === d.evaluation_id);
    t.textContent = ev ? `${d.username} · ${ev.name || ev.id}` : `${d.username} · chưa có evaluation ACTIVE`;
  }
  updatePayload();
}
async function refreshDres() {
  try { Object.assign(S.dres, await api('/api/dres/state')); } catch { /* server down: keep last */ }
  renderDresChip();
}
function fillEvals() {
  const d = S.dres, sel = $('#dEval'), wrap = $('#dEvWrap');
  wrap.hidden = !d.logged_in; $('#dOut').hidden = !d.logged_in; $('#dRefresh').hidden = !d.logged_in;
  sel.replaceChildren();
  for (const e of d.evaluations) sel.append(el('option', { value: e.id, selected: e.id === d.evaluation_id }, `${e.name || e.id}  [${e.status}]`));
  if (!d.evaluations.length) sel.append(el('option', { value: '' }, '(DRES chưa có evaluation nào)'));
  $('#dGo').textContent = d.logged_in ? 'Kết nối lại' : 'Kết nối';
}
function openDres() {
  $('#dBase').value = S.dres.base_url || store.get('dresBase', '') || (S.status && S.status.dres_base_url) || 'https://eventretrieval.one';
  $('#dUser').value = store.get('dresUser', '') || ''; $('#dPass').value = ''; $('#dMsg').textContent = '';
  $('#dColl').value = S.dres.collection || store.get('dresColl', '') || '';
  fillEvals(); if (!$('#dresDlg').open) $('#dresDlg').showModal();
  (S.dres.logged_in ? $('#dEval') : ($('#dUser').value ? $('#dPass') : $('#dUser'))).focus();
}
async function dresConnect() {
  const msg = $('#dMsg'), mode = $('#dMode [aria-selected=true]').dataset.m, base = $('#dBase').value.trim();
  msg.textContent = 'Đang kết nối…'; $('#dGo').disabled = true;
  try {
    const body = mode === 'login' ? { base_url: base, username: $('#dUser').value.trim(), password: $('#dPass').value }
                                  : { base_url: base, session_id: $('#dSid').value.trim() };
    const st = await post(mode === 'login' ? '/api/dres/login' : '/api/dres/session', body, 20000);
    Object.assign(S.dres, st); store.set('dresBase', base); if (mode === 'login') store.set('dresUser', $('#dUser').value.trim());
    if ($('#dColl').value.trim() !== (S.dres.collection || '')) await saveCollection();
    $('#dPass').value = ''; $('#dSid').value = '';
    renderDresChip(); fillEvals();
    if (st.evaluation_id) { $('#dresDlg').close(); }
    else msg.textContent = 'Đã đăng nhập nhưng chưa có evaluation nào ACTIVE — bấm “Làm mới” khi câu hỏi bắt đầu.';
  } catch (e) { msg.textContent = '✗ ' + e.message; }
  finally { $('#dGo').disabled = false; }
}

/* ------------------------------------------------------------------- init */
function renderAll() { renderTabs(); renderQuery(); renderResults(); renderBar(); renderLog(); tickTimer(); if (!S.log.length) $('#verdict').hidden = true; }
function renderTabs() { $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.task === S.task ? 'true' : 'false')); }
function setTask(t) {
  if (!TASKS[t] || t === S.task) return;
  S.task = t; store.set('task', t); S.sel = null; S.confirmArmed = false; $('#verdict').hidden = true;
  setError(''); renderAll(); $('#qtext')?.focus();
}
function applyCfg() {
  document.documentElement.style.setProperty('--card-min', S.cfg.thumb + 'px');
}

$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTask(b.dataset.task); });
$('#btnNew').addEventListener('click', startQuery);
$('#dresChip').addEventListener('click', openDres);
$('#btnLog').addEventListener('click', () => { const d = $('#drawer'); d.hidden = !d.hidden; renderLog(); });
$('#btnCfg').addEventListener('click', () => {
  $('#cThumb').value = S.cfg.thumb; $('#cTop').value = String(S.cfg.top); $('#cPm').value = S.cfg.pm;
  $('#cId').value = idMode();
  $('#cLive').checked = S.cfg.live; $('#cConfirm').checked = S.cfg.confirm; $('#cfgDlg').showModal();
});
$('#cThumb').addEventListener('input', e => { S.cfg.thumb = +e.target.value; store.set('thumb', S.cfg.thumb); applyCfg(); });
$('#cTop').addEventListener('change', e => { S.cfg.top = +e.target.value; store.set('top', S.cfg.top); });
$('#cPm').addEventListener('change', e => { S.cfg.pm = Math.max(0, +e.target.value || 0); store.set('pm', S.cfg.pm); updatePayload(); });
$('#cId').addEventListener('change', e => { S.cfg.idMode = e.target.value; store.set('idMode', S.cfg.idMode); updatePayload(); if (kind() === 'trake') renderResults(); });
$('#cLive').addEventListener('change', e => { S.cfg.live = e.target.checked; store.set('live', S.cfg.live); renderQuery(); });
$('#cConfirm').addEventListener('change', e => { S.cfg.confirm = e.target.checked; store.set('confirm', S.cfg.confirm); });
$('#dMode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  $$('#dMode button').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
  $('#dLogin').style.display = b.dataset.m === 'login' ? 'grid' : 'none';
  $('#dSess').style.display = b.dataset.m === 'session' ? 'block' : 'none';
});
$('#dresForm').addEventListener('submit', e => { e.preventDefault(); dresConnect(); });
async function saveCollection() {
  const c = $('#dColl').value.trim(); store.set('dresColl', c);
  try { Object.assign(S.dres, await post('/api/dres/collection', { collection: c })); $('#dMsg').textContent = c ? `Sẽ gửi kèm collection “${c}” khi nộp KIS.` : 'Không gửi collection.'; } catch (e) { $('#dMsg').textContent = '✗ ' + e.message; }
}
$('#dColl').addEventListener('change', saveCollection);
$('#dClose').addEventListener('click', () => $('#dresDlg').close());
$('#dOut').addEventListener('click', async () => { await post('/api/dres/logout').catch(() => { }); await refreshDres(); fillEvals(); });
$('#dRefresh').addEventListener('click', async () => {
  try { Object.assign(S.dres, await post('/api/dres/refresh')); renderDresChip(); fillEvals(); $('#dMsg').textContent = ''; }
  catch (e) { $('#dMsg').textContent = '✗ ' + e.message; }
});
$('#dEval').addEventListener('change', async e => {
  try { Object.assign(S.dres, await post('/api/dres/select', { evaluation_id: e.target.value })); renderDresChip(); } catch (er) { $('#dMsg').textContent = '✗ ' + er.message; }
});
$('#selMs').addEventListener('input', e => {
  if (!S.sel || S.sel.kind !== 'kis') return;
  const ms = Math.max(0, +e.target.value || 0); S.sel.ms = ms; S.confirmArmed = false;
  $('#barTimeHuman').textContent = '(' + fmtTime(ms) + ')'; updatePayload();
});
$('#ans').addEventListener('input', e => { S.answer = e.target.value; S.confirmArmed = false; updatePayload(); });
$('#ans').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } });
$('#btnSubmit').addEventListener('click', () => submit());
$('#btnClear').addEventListener('click', clearSel);
$('#btnView').addEventListener('click', () => {
  const s = S.sel; if (!s) return;
  if (s.kind === 'trake') openViewer({ video_id: s.video_id, ms: s.chosen[0].ms, frame_idx: s.chosen[0].frame_idx, fps: s.fps });
  else openViewer({ video_id: s.video_id, ms: s.ms, frame_idx: s.frame_idx, fps: s.fps });
});
$('#vClose').addEventListener('click', () => $('#viewer').close());
$('#viewer').addEventListener('close', () => { clearTimeout(viewerTimer); const v = $('#vVideo'); v.pause(); v.removeAttribute('src'); v.load(); });
$('#vPick').addEventListener('click', pickFromViewer);
$('#vBack').addEventListener('click', () => { const v = $('#vVideo'); v.currentTime = Math.max(0, v.currentTime - 1); });
$('#vFwd').addEventListener('click', () => { const v = $('#vVideo'); v.currentTime += 1; });

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.shiftKey) { e.preventDefault(); submit(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doSearch(); return; }
  if (e.altKey && /^[1-4]$/.test(e.key)) { e.preventDefault(); setTask(['tkis', 'vkis', 'qa', 'trake'][+e.key - 1]); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if (e.key === '/' && !typing) { e.preventDefault(); $('#qtext')?.focus(); }
  if (e.key === 'Escape' && !document.querySelector('dialog[open]') && S.sel) clearSel();
});
window.addEventListener('resize', syncBarHeight);

(async function init() {
  applyCfg(); renderAll();
  try {
    S.status = await api('/api/status', {}, 8000);
    S.legacy = !('ready' in S.status);          // the old /api/status has no `ready` field
    if (S.status.dres_base_url && !S.dres.base_url) S.dres.base_url = S.status.dres_base_url;
  } catch (e) { setError(e.message); }
  await refreshDres();
  if (S.status && S.status.ready === false) setError('Server đang nạp mô hình / index… đợi vài chục giây rồi tìm lại.');
  else if (S.status && !S.legacy) setStatus(el('span', {}, 'Index: ', el('b', {}, (S.status.frames || 0).toLocaleString('vi')), ' khung · ', el('b', {}, (S.status.videos || 0).toLocaleString('vi')), ' video'));
  $('#qtext')?.focus();
  setInterval(() => { if (!document.hidden) refreshDres(); }, 15000);      // the server keeps the DRES session alive; just show its state
})();
</script>
