<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Answer Submission</title>
    <style>
        :root {
            --bg: #0f0f14;
            --panel: #1a1a24;
            --border: #2a2a3a;
            --text: #e0e0e8;
            --text-secondary: #8888a0;
            --accent: #6c5ce7;
            --success: #00d68f;
            --error: #ff5252;
            --warning: #ffb74d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
        }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header p { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .sidebar > div {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .question-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .question-display {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }
        .question-id { font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .question-type {
            display: inline-block;
            background: var(--accent);
            color: var(--bg);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .question-type.VKIS { background: var(--warning); }
        .question-text {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text);
            margin-bottom: 12px;
        }
        .question-image {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            border: 1px solid var(--border);
            object-fit: contain;
        }
        .answers-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            background: var(--bg);
        }
        .answer-input-row {
            display: grid;
            grid-template-columns: 50px 1fr;
            gap: 8px;
            align-items: center;
        }
        .answer-input-row label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: right;
        }
        .answer-input-row input {
            padding: 6px 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.8rem;
        }
        .answer-input-row input:focus { outline: none; border-color: var(--accent); }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--accent); }
        .btn-row { display: flex; gap: 8px; flex-direction: column; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }
        .stats {
            display: flex;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .stat { background: var(--bg); padding: 4px 8px; border-radius: 4px; }
        .stat .val { color: var(--accent); font-weight: 600; }
        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-zone:hover { border-color: var(--accent); background: rgba(108, 92, 231, 0.05); }
        .upload-zone input { display: none; }
        .upload-zone p { font-size: 0.85rem; margin: 0; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            z-index: 2000;
            animation: slideIn 0.3s;
        }
        .toast.error { background: var(--error); color: white; }
        .toast.ok { background: var(--success); color: var(--bg); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            text-align: center;
            color: var(--text-secondary);
        }
        .empty-state > div { font-size: 2rem; margin-bottom: 12px; }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.9rem;
        }
        input[type="number"]:focus { outline: none; border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="header">
        <h1>📝 Batch Answer Submission</h1>
        <p>Submit ranked answers for 100 queries (TKIS + VKIS)</p>
    </div>

    <div class="container">
        <div class="sidebar">
            <div>
                <label class="section-label">📁 Load Questions</label>
                <div class="upload-zone" id="uploadZone">
                    <input id="csvUpload" type="file" accept=".csv" />
                    <p>Drop CSV here or click</p>
                </div>
            </div>

            <div>
                <label class="section-label">📊 Progress</label>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="stats">
                    <div class="stat">Answered: <span class="val" id="answeredCount">0</span>/100</div>
                    <div class="stat">Current: <span class="val" id="currentIdx">-</span></div>
                </div>
            </div>

            <div>
                <label class="section-label">🎯 Navigation</label>
                <div class="btn-row">
                    <button class="btn btn-secondary" onclick="prevQuestion()">← Previous</button>
                    <input id="gotoIdx" type="number" min="0" max="99" placeholder="Go to #" />
                    <button class="btn btn-secondary" onclick="gotoQuestion()">Go</button>
                    <button class="btn btn-secondary" onclick="nextQuestion()">Next →</button>
                </div>
            </div>

            <div>
                <label class="section-label">⚡ Auto Fill</label>
                <div class="btn-row">
                    <button id="autoCurrentBtn" class="btn btn-secondary" onclick="autoFillCurrent()">Auto current</button>
                    <button id="autoAllBtn" class="btn btn-secondary" onclick="autoFillAll()">Auto all</button>
                </div>
            </div>

            <div>
                <label class="section-label">⬇️ Export</label>
                <button class="btn btn-primary" onclick="exportCSV()" style="width: 100%;">Export CSV</button>
            </div>
        </div>

        <div class="main">
            <div class="question-box">
                <div id="questionBox" style="display: none; flex: 1; overflow: hidden; display: flex; flex-direction: column;">
                    <div class="question-display">
                        <div class="question-id" id="qId">Q_0001</div>
                        <span class="question-type" id="qType">TKIS</span>
                        <div class="question-text" id="qText">Loading...</div>
                        <img id="qImage" class="question-image" style="display: none;" />
                    </div>

                    <div style="flex: 1; display: flex; flex-direction: column; margin-top: 12px;">
                        <label class="section-label">📌 Top 100 Answers</label>
                        <div class="answers-box" id="answersBox"></div>
                    </div>
                </div>
                <div id="emptyState" class="empty-state">
                    <div>📤</div>
                    <p>Upload questions.csv to get started</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        let allQuestions = [];
        let answers = {};
        let currentIdx = -1;
        let autoRunning = false;

        // CSV upload
        document.getElementById('uploadZone').addEventListener('click', () => document.getElementById('csvUpload').click());
        document.getElementById('csvUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    parseCSV(evt.target.result);
                    currentIdx = 0;
                    renderQuestion();
                    toast('Loaded ' + allQuestions.length + ' questions', 'ok');
                } catch (err) {
                    toast('Error loading CSV: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        });

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            allQuestions = [];
            answers = {};
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // Simple CSV parse (handle quoted values)
                const parts = [];
                let current = '';
                let inQuotes = false;
                for (let j = 0; j < line.length; j++) {
                    if (line[j] === '"') {
                        inQuotes = !inQuotes;
                    } else if (line[j] === ',' && !inQuotes) {
                        parts.push(current.trim());
                        current = '';
                    } else {
                        current += line[j];
                    }
                }
                parts.push(current.trim());

                if (parts.length < 4) continue;
                const [queryId, task, text, queryImage] = parts;
                const cleanTask = (task || 'TKIS').trim().toUpperCase();
                allQuestions.push({
                    query_id: queryId,
                    task: cleanTask,
                    text: text,
                    query_image: queryImage,
                });
                answers[queryId] = Array(100).fill('');
            }
        }

        function renderQuestion() {
            if (currentIdx < 0 || currentIdx >= allQuestions.length) {
                document.getElementById('emptyState').style.display = 'flex';
                document.getElementById('questionBox').style.display = 'none';
                return;
            }
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('questionBox').style.display = 'flex';

            const q = allQuestions[currentIdx];
            document.getElementById('qId').textContent = q.query_id;
            document.getElementById('qType').textContent = q.task;
            document.getElementById('qType').className = 'question-type ' + q.task;

            if (q.task === 'TKIS') {
                document.getElementById('qText').textContent = q.text;
                document.getElementById('qImage').style.display = 'none';
            } else {
                document.getElementById('qText').textContent = '(Visual Query Image)';
                if (q.query_image) {
                    document.getElementById('qImage').src = q.query_image;
                    document.getElementById('qImage').style.display = 'block';
                } else {
                    document.getElementById('qImage').style.display = 'none';
                }
            }

            renderAnswers(q.query_id);
            updateProgress();
        }

        function renderAnswers(queryId) {
            const box = document.getElementById('answersBox');
            const ansList = answers[queryId] || Array(100).fill('');
            box.innerHTML = '';

            for (let i = 0; i < 100; i++) {
                const row = document.createElement('div');
                row.className = 'answer-input-row';
                const padded = String(i + 1).padStart(3, '0');
                row.innerHTML = `
                    <label>#${padded}</label>
                    <input type="text" placeholder="video.mp4,123"
                           data-idx="${i}"
                           value="${ansList[i] || ''}"
                           onchange="updateAnswer('${queryId}', this.dataset.idx, this.value)" />
                `;
                box.appendChild(row);
            }
        }

        function updateAnswer(queryId, idx, value) {
            if (!answers[queryId]) answers[queryId] = Array(100).fill('');
            answers[queryId][parseInt(idx)] = value.trim();
        }

        function nextQuestion() {
            if (currentIdx < allQuestions.length - 1) {
                currentIdx++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion();
            }
        }

        function gotoQuestion() {
            const idx = parseInt(document.getElementById('gotoIdx').value);
            if (idx >= 0 && idx < allQuestions.length) {
                currentIdx = idx;
                renderQuestion();
                document.getElementById('gotoIdx').value = '';
            } else {
                toast('Invalid question number', 'error');
            }
        }

        function updateProgress() {
            const total = allQuestions.length;
            const answered = Object.keys(answers).filter(qid => answers[qid].some(v => v)).length;
            const pct = total > 0 ? (answered / total * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('currentIdx').textContent = (currentIdx + 1) + '/' + total;
        }

        function setAutoButtonsState(isRunning) {
            autoRunning = isRunning;
            document.getElementById('autoCurrentBtn').disabled = isRunning;
            document.getElementById('autoAllBtn').disabled = isRunning;
        }

        function normalizeAnswersFromResults(results) {
            const out = [];
            for (const r of (results || []).slice(0, 100)) {
                const videoId = (r.video_id || '').trim();
                const frameIdx = Number.isFinite(r.frame_idx) ? r.frame_idx : parseInt(r.frame_idx || 0, 10);
                if (videoId) out.push(videoId + ',' + (Number.isFinite(frameIdx) ? frameIdx : 0));
            }
            while (out.length < 100) out.push('');
            return out.slice(0, 100);
        }

        async function runSearchForQuestion(q) {
            if (q.task === 'TKIS') {
                const text = (q.text || '').trim();
                if (!text) throw new Error('Empty TKIS text');

                const resp = await fetch(`${API}/api/search?expand_neighbors=false&dedup=true`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text, top_k: 100 }),
                });
                const payload = await resp.json();
                if (!resp.ok) throw new Error(payload.detail || 'Text search failed');
                return payload.results || [];
            }

            const imageRef = (q.query_image || '').trim();
            if (!imageRef) throw new Error('Missing VKIS query_image');

            if (/^https?:\/\//i.test(imageRef)) {
                const imageResp = await fetch(imageRef);
                if (!imageResp.ok) throw new Error('Cannot download VKIS image URL');
                const imageBlob = await imageResp.blob();
                const formData = new FormData();
                formData.append('file', imageBlob, imageRef.split('/').pop() || 'query.jpg');
                formData.append('top_k', '100');

                const searchResp = await fetch(`${API}/api/search-image`, {
                    method: 'POST',
                    body: formData,
                });
                const payload = await searchResp.json();
                if (!searchResp.ok) throw new Error(payload.detail || 'Image search failed');
                return payload.results || [];
            }

            const formData = new FormData();
            formData.append('image_path', imageRef);
            formData.append('top_k', '100');
            const resp = await fetch(`${API}/api/search-image-path`, {
                method: 'POST',
                body: formData,
            });
            const payload = await resp.json();
            if (!resp.ok) throw new Error(payload.detail || 'Image path search failed');
            return payload.results || [];
        }

        async function autoFillCurrent() {
            if (autoRunning) return;
            if (currentIdx < 0 || currentIdx >= allQuestions.length) {
                toast('No question selected', 'error');
                return;
            }

            const q = allQuestions[currentIdx];
            setAutoButtonsState(true);
            try {
                const results = await runSearchForQuestion(q);
                answers[q.query_id] = normalizeAnswersFromResults(results);
                renderAnswers(q.query_id);
                updateProgress();
                toast('Auto-filled ' + q.query_id, 'ok');
            } catch (err) {
                toast('Auto-fill failed: ' + err.message, 'error');
            } finally {
                setAutoButtonsState(false);
            }
        }

        async function autoFillAll() {
            if (autoRunning) return;
            if (allQuestions.length === 0) {
                toast('No questions loaded', 'error');
                return;
            }

            setAutoButtonsState(true);
            let okCount = 0;
            let failCount = 0;

            try {
                for (let i = 0; i < allQuestions.length; i++) {
                    const q = allQuestions[i];
                    currentIdx = i;
                    renderQuestion();

                    try {
                        const results = await runSearchForQuestion(q);
                        answers[q.query_id] = normalizeAnswersFromResults(results);
                        okCount++;
                    } catch (err) {
                        failCount++;
                        console.error('Auto-fill failed for', q.query_id, err);
                    }

                    updateProgress();
                    await new Promise(resolve => setTimeout(resolve, 150));
                }

                renderQuestion();
                toast(`Auto-fill done: ${okCount} ok, ${failCount} failed`, failCount ? 'error' : 'ok');
            } finally {
                setAutoButtonsState(false);
            }
        }

        function exportCSV() {
            if (allQuestions.length === 0) {
                toast('No questions loaded', 'error');
                return;
            }

            const header = ['query_id'];
            for (let i = 1; i <= 100; i++) {
                header.push('answer_' + String(i).padStart(3, '0'));
            }

            const lines = [header.join(',')];

            for (const q of allQuestions) {
                const qId = q.query_id;
                const ansList = answers[qId] || Array(100).fill('');
                const cells = [qId];
                for (const ans of ansList) {
                    if (ans) {
                        cells.push('"' + ans + '"');
                    } else {
                        cells.push('');
                    }
                }
                lines.push(cells.join(','));
            }

            const csv = lines.join('\n');
            const blob = new Blob([csv + '\n'], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'submission.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            toast('Exported submission.csv', 'ok');
        }

        function toast(m, t) {
            const el = document.createElement('div');
            el.className = `toast ${t}`;
            el.textContent = m;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }
    </script>
</body>
</html>
